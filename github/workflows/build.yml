name: Build NguonC CloudStream Plugin

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build .cs3 Plugin and plugins.json
        run: gradle make makePluginsJson

      - name: Prepare Output Directory
        run: |
          mkdir -p dist
          cp NguonCProvider/build/NguonCProvider.cs3 dist/
          cp build/plugins.json dist/
          sed "s|%GITHUB_REPOSITORY%|${GITHUB_REPOSITORY}|g" repo.json > dist/repo.json

      - name: Upload NguonCProvider.cs3 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NguonCProvider-cs3
          path: dist/NguonCProvider.cs3

      - name: Deploy to builds branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: builds
          force_orphan: true
